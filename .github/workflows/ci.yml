name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SecondGuess.slnx --configuration Release

      - name: Test
        run: dotnet test SecondGuess.slnx --configuration Release --no-build

      - name: Generate sample matches
        run: |
          dotnet run --project src/SecondGuess.Generator --configuration Release --no-build -- \
            generate --seed 100 --matches 5 --out artifacts/ci | tee artifacts-summary.txt

      - name: Check match realism
        run: |
          if grep -q "CHECK" artifacts-summary.txt; then
            echo "::warning title=Match realism::Some generated metrics are outside realistic ranges. See the job log."
            grep "CHECK" artifacts-summary.txt
          else
            echo "All generated metrics are within realistic ranges."
          fi

      - name: Upload generated matches
        uses: actions/upload-artifact@v4
        with:
          name: generated-matches
          path: artifacts/ci

  container:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Build the container image
        run: docker build -t second-guess:ci .

      - name: Start it and check health
        run: |
          docker run -d --name sg -p 8080:8080 second-guess:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs sg
          exit 1
